<div id="setup-overlay" class="open">
  <div id="setup-card">
    <div id="setup-title">Setting up tools</div>
    <div id="setup-subtitle">LoopDec is downloading the latest yt-dlp and ffmpeg. This only happens once.</div>
    <div class="setup-bin-row" id="setup-row-yt-dlp" data-state="waiting">
      <span class="setup-bin-name">yt-dlp</span>
      <div style="flex:1">
        <div class="setup-bin-status">Waiting...</div>
        <div class="setup-progress"><div class="setup-progress-fill"></div></div>
      </div>
    </div>
    <div class="setup-bin-row" id="setup-row-ffmpeg" data-state="waiting">
      <span class="setup-bin-name">ffmpeg</span>
      <div style="flex:1">
        <div class="setup-bin-status">Waiting...</div>
        <div class="setup-progress"><div class="setup-progress-fill"></div></div>
      </div>
    </div>
    <div id="setup-error"></div>
  </div>
</div>
