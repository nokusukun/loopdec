<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoopDec</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <!-- LoopDec mark: 2x2 pad bank, diagonal pads filled. Defined once,
       referenced via <use> wherever the brand appears. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="loopdec-mark" viewBox="0 0 16 16">
      <rect x="1.5" y="1.5" width="5" height="5" fill="currentColor"/>
      <rect x="9.5" y="1.5" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <rect x="1.5" y="9.5" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <rect x="9.5" y="9.5" width="5" height="5" fill="currentColor"/>
    </symbol>
  </svg>

  <!-- @include partials/titlebar.html -->

  <main id="clips-container" data-empty="true">
    <div class="tiles-grid" id="tiles-grid">
      <div id="empty-state">Paste a YouTube URL above to add a clip</div>
    </div>

    <!-- @include partials/idle-screen.html -->
  </main>

  <!-- @include partials/sidebar.html -->
  <!-- @include partials/command-palette.html -->
  <!-- @include partials/waveform-editor.html -->
  <!-- @include partials/drop-overlay.html -->
  <!-- @include partials/setup-overlay.html -->

  <script src="renderer.js"></script>
</body>
</html>
