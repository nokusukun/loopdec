<aside id="speed-panel" data-active="false" aria-label="Per-track playback speed">
  <span class="speed-label">SPD</span>
  <div class="speed-track" id="speed-track">
    <div class="speed-detent"></div>
    <div class="speed-thumb"></div>
  </div>
  <span class="speed-readout" id="speed-readout">1.00&times;</span>
  <button id="speed-lock" class="speed-lock-btn" title="Hold pitch — preserve pitch when changing speed (time-stretch)" aria-pressed="false">HOLD</button>
</aside>
