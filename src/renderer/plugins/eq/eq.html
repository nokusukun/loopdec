<aside id="eq-panel" aria-label="Per-track 8-band equalizer" data-active="false">
  <header class="eq-head">
    <span class="eq-title">EQ</span>
    <span class="eq-status" id="eq-status">FLAT</span>
    <button id="eq-reset" class="eq-reset-btn" title="Flatten all bands">RESET</button>
  </header>
  <div class="eq-stage">
    <div class="eq-scale" aria-hidden="true">
      <span>+12</span>
      <span>+6</span>
      <span class="eq-scale-zero">0</span>
      <span>&minus;6</span>
      <span>&minus;12</span>
    </div>
    <div class="eq-bands" id="eq-bands">
      <div class="eq-band" data-band="0" data-state="neutral" aria-label="63 Hz">
        <div class="eq-readout"></div>
        <div class="eq-track"><div class="eq-grid"></div><div class="eq-fill"></div><div class="eq-thumb"></div></div>
        <div class="eq-freq">63</div>
      </div>
      <div class="eq-band" data-band="1" data-state="neutral" aria-label="160 Hz">
        <div class="eq-readout"></div>
        <div class="eq-track"><div class="eq-grid"></div><div class="eq-fill"></div><div class="eq-thumb"></div></div>
        <div class="eq-freq">160</div>
      </div>
      <div class="eq-band" data-band="2" data-state="neutral" aria-label="400 Hz">
        <div class="eq-readout"></div>
        <div class="eq-track"><div class="eq-grid"></div><div class="eq-fill"></div><div class="eq-thumb"></div></div>
        <div class="eq-freq">400</div>
      </div>
      <div class="eq-band" data-band="3" data-state="neutral" aria-label="1 kHz">
        <div class="eq-readout"></div>
        <div class="eq-track"><div class="eq-grid"></div><div class="eq-fill"></div><div class="eq-thumb"></div></div>
        <div class="eq-freq">1k</div>
      </div>
      <div class="eq-band" data-band="4" data-state="neutral" aria-label="2.5 kHz">
        <div class="eq-readout"></div>
        <div class="eq-track"><div class="eq-grid"></div><div class="eq-fill"></div><div class="eq-thumb"></div></div>
        <div class="eq-freq">2.5k</div>
      </div>
      <div class="eq-band" data-band="5" data-state="neutral" aria-label="6.3 kHz">
        <div class="eq-readout"></div>
        <div class="eq-track"><div class="eq-grid"></div><div class="eq-fill"></div><div class="eq-thumb"></div></div>
        <div class="eq-freq">6.3k</div>
      </div>
      <div class="eq-band" data-band="6" data-state="neutral" aria-label="10 kHz">
        <div class="eq-readout"></div>
        <div class="eq-track"><div class="eq-grid"></div><div class="eq-fill"></div><div class="eq-thumb"></div></div>
        <div class="eq-freq">10k</div>
      </div>
      <div class="eq-band" data-band="7" data-state="neutral" aria-label="16 kHz">
        <div class="eq-readout"></div>
        <div class="eq-track"><div class="eq-grid"></div><div class="eq-fill"></div><div class="eq-thumb"></div></div>
        <div class="eq-freq">16k</div>
      </div>
    </div>
  </div>
</aside>
